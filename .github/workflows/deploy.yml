name: Déploiement GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Injection sécurisée de ads.txt (Option A)
        shell: bash
        run: |
          if [ -n "${{ secrets.ADS_TXT }}" ]; then
            echo "${{ secrets.ADS_TXT }}" > ads.txt
            echo "✓ ads.txt injecté avec succès pour GitHub Pages."
          else
            echo "ℹ Secret ADS_TXT non configuré ou fork détecté - déploiement sans ads.txt."
          fi

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
