name: Intégration Automatique des Issues Validées

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numéro de l'issue à intégrer manuellement"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: "wiki-database-update"
  cancel-in-progress: false

jobs:
  apply_contribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Traitement et intégration de la proposition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          python .github/scripts/apply_issue.py

      - name: Publication des modifications sur main
        shell: bash
        run: |
          # Vérifier si des fichiers ont été modifiés dans data/
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            ISSUE_NUM="${{ github.event.issue.number || inputs.issue_number }}"
            git commit -m "Auto: Intégration de la proposition validée (Issue #${ISSUE_NUM})"
            git push origin main
            echo "✓ Modifications validées et poussées sur main. Le workflow de déploiement GitHub Pages va démarrer."
          else
            echo "ℹ Aucun changement détecté dans la base de données (issue sans payload ou déjà intégrée)."
          fi
